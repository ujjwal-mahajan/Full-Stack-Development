<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sanket!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            color: #fff;
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-width: 90%;
            width: 450px;
            z-index: 10;
        }

        h1 {
            font-size: 2.8em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            line-height: 1.2;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1em;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        button:hover {
            background: #ff5252;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }

        button:active {
            transform: translateY(1px) scale(0.98);
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            z-index: 1;
            border-radius: 2px;
        }

        @media (max-width: 400px) {
            h1 { font-size: 2.2em; }
            p { font-size: 1em; }
            .card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Happy Birthday, <br>Sanket Don! 🎉</h1>
        <p>Enginners group che Khajindar, Sanket Bhai yanna Janma Dinacha Hardik Subhechaa!</p>
        <button id="celebrateBtn">Celebrate! 🎈</button>
    </div>

    <script>
        const button = document.getElementById('celebrateBtn');
        const colors = ['#ff6b6b', '#feca57', '#1dd1a1', '#5f27cd', '#54a0ff', '#ffffff'];

        button.addEventListener('click', () => {
            for(let i = 0; i < 80; i++) {
                setTimeout(createConfetti, i * 20);
            }
        });

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = -20 + 'px';
            
            confetti.style.transform = `rotate(${Math.random() * 360}deg)`;

            const size = Math.random() * 8 + 6;
            confetti.style.width = size + 'px';
            confetti.style.height = size + 'px';

            document.body.appendChild(confetti);

            const animation = confetti.animate([
                { transform: `translate3d(0,0,0) rotate(0deg)`, opacity: 1 },
                { transform: `translate3d(${Math.random() * 300 - 150}px, 105vh, 0) rotate(${Math.random() * 720}deg)`, opacity: 0.8 }
            ], {
                duration: Math.random() * 2000 + 2000,
                easing: 'cubic-bezier(.37,0,.63,1)'
            });

            animation.onfinish = () => confetti.remove();
        }

        window.onload = () => {
            setTimeout(() => button.click(), 500);
        };
    </script>
</body>
</html>
