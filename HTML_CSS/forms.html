<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="forms.css">
    <title>Forms</title>
</head>
<body>
    
    <form>
        <h1>Xpediolive</h1>

        <label for="fname">First Name</label>
        <input id="fname" type="text">

        <label for="mname">Middle Name</label>
        <input id="mname" type="text">
                
        <label for="lname">Last Name</label>
        <input id="lname" type="text"><br><br>
                
        <label for="age">Age</label>
        <input id="age" type="number">

        <label for="uname">User Name</label>
        <input id="uname" type="text">

        <label for="pass">Password</label>
        <input id="pass" type="text"><br><br>

        <label for="bdate">Birth Date</label>
        <input id="bdate" type="date">

        <label for="btime">Birth Time</label>
        <input id="btime" type="time">

        <label for="bdt">Birth Date & Time</label>
        <input id="bdt" type="datetime-local"><br><br>

        <!-- <input type="image" src="IMG/bird.jfif"> -->

        <input type="color" name="" id="">

        <input type="range" name="" id="">

        <input type="search" name="" id="">

        <input type="reset" name="" id=""><br><br>

        <label for="lang">Language Known:</label>
        <input type="checkbox" id="eng" name="eng" value="English">
        <label for="eng">English</label>
        <input type="checkbox" id="hin" name="hin" value="Hindi">
        <label for="hin">Hindi</label>
        <input type="checkbox" id="mar" name="mar" value="Marathi">
        <label for="mar">Marathi</label>

        <label for="gen" style="margin-left: 50px;">Gender</label>
        <input type="radio" name="gen" id="male" value="Male">
        <label for="male">Male</label>
        <input type="radio" name="gen" id="female" value="Female">
        <label for="female">Female</label><br><br>

        <label for="file">Upload photo</label>
        <input type="file" id="file">
        
        <label for="">Cities</label>
        <select name="city" id="city" style="width: 100px;">
            <option></option>
            <option value="mum">Mumbai</option>
            <option value="pun">Pune</option>
            <option value="nsk">Nashik</option>
        </select><br><br>

        <textarea style="width: 100%;" rows="5"></textarea><br><br>

        <input type="submit">

    </form>

</body>
</html>
