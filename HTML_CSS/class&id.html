<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class & ID</title>
    <link rel="stylesheet" href="class&id.css">
</head>
<body>

    <!-- <div class="cl1 cl2" id="id1">Xpedio</div> -->
     <form>
        <h1>Sample form</h1>

        <div>
            <label for="fname" class="lb">First Name</label>
            <input type="text" id="fname" class="in" placeholder="Insert first name" required autocomplete="on">

            <label for="mname" class="lb">Middle Name</label>
            <input type="text" id="mname" class="in" placeholder="Insert middle name">

            <label for="lname" class="lb">Last Name</label>
            <input type="text" id="lname" class="in" placeholder="Insert last name" autofocus>
        </div>

        <div>
            <label for="add">Address</label>
            <input type="text" style="width: 85%;" id="add">
        </div>

        <div>
            <label for="bdate">Birth Date</label>
            <input type="date" id="Date">

            <label for="time">Time</label>
            <input type="time" id="Time">

            <label for="datetime">Date & Time</label>
            <input type="datetime-local" id="datetime">
        </div>

        <div>
            <label for="month">Month</label>
            <input type="month" id="month">

            <label for="age">Age</label>
            <input type="number" id="Age" max="17" min="1">
        </div>

        <div>
            <label for="password">Password</label>
            <input type="password" id="password">

            <label for="emailid">Email Id</label>
            <input type="email" id="email">
        </div>

        <div>
            <label style="font-weight: bold;">Languages Known:</label>
            <input type="checkbox" id="eng" name="eng" value="English">
            <label for="lang">English</label>
            <input type="checkbox" id="hin" name="hin" value="Hndi">
            <label for="lang">Hindi</label>
            <input type="checkbox" id="mar" name="mar" value="Marathi">
            <label for="lang">Marathi</label>
        </div>

        <div>
            <label style="font-weight: bold;">Gender:</label>
            <input type="radio" id="male" name="gen" value="Male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gen" value="Female">
            <label for="female">Female</label>
        </div>

        <div>
            <input type="color" name="" id="">
            <input type="range" name="" id=""> 
            <input type="search" name="" id="">
            <input type="file" name="" id="" multiple>
        </div>

        <div>
            <label for="day">Day name</label>
            <input type="text" name="day_name" id="day" pattern="[A-Za-z]{4}" title="Four letter day name">
        </div>

        <div style="text-align: center;">
            <input type="button" class="btn" value="Save">
            <input type="submit" class="btn" value="Submit">
        </div>

        <div>
            <input type="image" src="IMG/Animated Image.webp" width="100%;">
        </div>

     </form>
    
</body>
</html>
