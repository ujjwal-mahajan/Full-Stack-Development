<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ImageHide.css">
    <title>Document</title>
</head>
<body>

    <h1>Xpediolive</h1>

    <div class="imgBox" id="imgBox1">
        <img src="IMG/Nature.3.jpeg">
        <button onclick="remove()">Remove</button>
    </div>

    <div class="imgBox" id="imgBox2">
        <img src="IMG/Nature 2.jfif">
        <button onclick="hide()">Hide</button>
    </div>

    <div class="imgBox" id="imgBox3">
        <img src="IMG/Nature.jpg">
        <button onclick="reset()">Reset</button>
    </div>

    <script>
        function remove() {
            document.getElementById('imgBox1').style.display = "none";
        }

        function hide() {
            document.getElementById('imgBox2').style.display = "hidden";
        }

        function reset() {
            document.getElementById('imgBox1').style.display = "block";
            document.getElementById('imgBox2').style.visibility = "visible";
        }
    </script>
    
</body>
</html>
