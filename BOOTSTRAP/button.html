<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    
    <div class="container-fluid">
        <h1 class="text-center display-3">Xpediolive</h1>

        <button type="button">HTML</button>
        <button type="button" class="btn">Basic</button>
        <button type="button" class="btn btn-warning">Warning</button>
        <button type="button" class="btn btn-warning btn-lg">Warning</button>
        <button type="button" class="btn btn-warning btn-sm">Warning</button>
        <button type="button" class="btn btn-danger active">Danger</button>
        <button type="button" class="btn btn-danger disabled">Danger</button>
        <button type="button" class="btn btn-outline-primary">Primary</button>
        <button type="button" class="btn btn-link">Link</button><br><br>

        <button class="btn btn-success">
            <span class="spinner-border spinner-border-sm"></span>
        </button>

        <button class="btn btn-success">
            <span class="spinner-border spinner-border-sm"></span>
            Loading...
        </button>

        <button class="btn btn-success" disabled>
            <span class="spinner-border spinner-border-sm"></span>
            Loading...
        </button><br><br>

        <button class="btn btn-success" disabled>
            <span class="spinner-grow spinner-grow-sm"></span>
            Loading...
        </button>

        <div class="btn-group">
            <button type="button" class="btn btn-primary">HP</button>
            <button type="button" class="btn btn-primary">Dell</button>
            <button type="button" class="btn btn-primary">Apple</button>
        </div>

        <div class="btn-group">
            <button type="button" class="btn btn-primary">HP</button>
            <button type="button" class="btn btn-primary">Dell</button>
            <div class="btn-group">
                <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">Apple</button>
                <div class="dropdown-menu">
                    <a href="#" class="dropdown-item">Apple Airbook</a>
                    <a href="#" class="dropdown-item">Iphone</a>
                </div>
            </div>
        </div><br><br>

        <div class="btn-group-vertical mb-5">
            <button type="button" class="btn btn-primary">HP</button>
            <button type="button" class="btn btn-primary">Dell</button>
            <button type="button" class="btn btn-primary">Apple</button>
        </div>

        <h1>
            Inbox
            <span class="badge bg-primary">8</span>
        </h1>
        <h1>
            Sent
            <span class="badge bg-success">3</span>
        </h1>
        <h1>
            Draft
            <span class="badge bg-secondary rounded-pill">32</span>
        </h1>

        <button type="button" class="btn btn-warning">
            junk <span class="badge bg-danger">10</span>
        </button>

    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
